function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  remove(k){try{localStorage.removeItem(k)}catch(e){}},
  keys(){try{return Object.keys(localStorage)}catch(e){return []}}
};
function gmUrl(name,lat,lon){const q=(typeof lat==='number'&&typeof lon==='number')?`${lat},${lon}`:name;return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`}
function amUrl(name,lat,lon){if(typeof lat==='number'&&typeof lon==='number')return `https://maps.apple.com/?ll=${encodeURIComponent(lat+','+lon)}&q=${encodeURIComponent(name)}`;return `https://maps.apple.com/?q=${encodeURIComponent(name)}`}
function mapButtons(name,lat,lon){return `<div class="place-actions"><a class="map-link google" target="_blank" rel="noopener" href="${gmUrl(name,lat,lon)}">Google Maps</a><a class="map-link apple" target="_blank" rel="noopener" href="${amUrl(name,lat,lon)}">Apple Maps</a></div>`}
function dateForId(id){return new Date(2026,Number(id.slice(0,2))-1,Number(id.slice(2,4)))}
function dayKey(dt){return `${String(dt.getMonth()+1).padStart(2,'0')}${String(dt.getDate()).padStart(2,'0')}`}
function todayTripId(){const now=new Date();const key=dayKey(now);if(now.getFullYear()===2026&&trip.some(d=>d.id===key))return key;const first=dateForId(trip[0].id),last=dateForId(trip[trip.length-1].id);if(now<first)return trip[0].id;if(now>last)return trip[trip.length-1].id;let best=trip[0],bestDiff=Infinity;trip.forEach(d=>{const diff=Math.abs(dateForId(d.id)-now);if(diff<bestDiff){best=d;bestDiff=diff}});return best.id}
function isDeviceToday(id){const n=new Date();return n.getFullYear()===2026&&dayKey(n)===id}
function renderNav(activeId){dayNav.innerHTML=trip.map(d=>`<button type="button" class="day-btn ${d.id===activeId?'active':''}" data-id="${d.id}" aria-current="${d.id===activeId?'page':'false'}"><div class="date">${esc(d.date)}${isDeviceToday(d.id)?'<span class="today-badge">TODAY</span>':''}</div><div class="name">${esc(d.title)}</div></button>`).join('');dayNav.querySelectorAll('.day-btn').forEach(b=>b.onclick=()=>activateDay(b.dataset.id))}
function tagHTML(tags=[]){return `<div class="pill-row">${tags.map(t=>`<span class="pill ${t[2]||''}">${esc(t[0])} ${esc(t[1])}</span>`).join('')}</div>`}
function constraintsHTML(id){const rows=constraints[id]||[];return rows.length?`<div class="constraint-wrap">${rows.map((x,i)=>`<div class="constraint-card ${id==='0828'||(id==='0821'&&i===0)?'critical':''}"><div class="constraint-icon">${x[0]}</div><div><b>${esc(x[1])}</b><span>${esc(x[2])}</span></div></div>`).join('')}</div>`:''}
function timelineHTML(items=[]){return `<div class="timeline">${items.map(x=>`<div class="stop"><div class="stop-icon">${x[0]}</div><div class="stop-content"><b>${esc(x[1])}</b><small>${esc(x[2])}</small></div></div>`).join('')}</div>`}
function choicesHTML(d){if(!d.choices)return'';return Object.entries(d.choices).map(([key,g])=>{const saved=store.get('choice_'+key);return `<div style="margin-bottom:16px"><h3 class="section-title">${esc(g.label)}</h3><div class="choice-group">${g.options.map(o=>`<label class="choice ${saved===o[0]?'selected':''}"><input type="radio" name="${key}" value="${o[0]}" ${saved===o[0]?'checked':''}><span><b>${esc(o[1])}</b><small>${esc(o[2])}</small></span></label>`).join('')}</div></div>`}).join('')}
function placesHTML(items,title){if(!items?.length)return'';return `<div class="panel"><div class="panel-body"><h3 class="section-title">${esc(title)}</h3><div class="cards">${items.map(x=>`<div class="place"><div class="kicker">${esc(x[0])}</div><h4>${esc(x[1])}</h4><p>${esc(x[2])}</p>${mapButtons(x[1])}</div>`).join('')}</div></div></div>`}
function mapPlacesHTML(d){if(!d.points?.length)return'';return `<div class="map-place-list">${d.points.map((p,i)=>`<div class="map-place-row"><span>${i+1}. ${esc(p[0])}</span><div class="map-actions"><a class="map-link google" target="_blank" rel="noopener" href="${gmUrl(p[0],p[1],p[2])}">Google</a><a class="map-link apple" target="_blank" rel="noopener" href="${amUrl(p[0],p[1],p[2])}">Apple</a></div></div>`).join('')}</div>`}
function renderContent(){content.innerHTML=trip.map(d=>`<section class="day-card" id="day-${d.id}"><div class="top-grid"><div class="panel"><div class="panel-body"><div class="day-title"><div><div class="eyebrow" style="color:#6a665f">${esc(d.date)}${isDeviceToday(d.id)?'<span class="today-badge">오늘</span>':''}</div><h2>${esc(d.title)}</h2><p>${esc(d.subtitle)}</p></div></div>${tagHTML(d.tags)}${constraintsHTML(d.id)}<div style="height:16px"></div><h3 class="section-title">오늘의 흐름</h3>${timelineHTML(d.timeline)}<label class="done-toggle"><input type="checkbox" class="done-check" data-id="${d.id}"> 오늘 일정 완료</label></div></div><div class="panel"><div class="panel-body" style="padding-bottom:12px"><h3 class="section-title">지도</h3><div class="footer-note">지도 타일이 안 뜨면 아래 Google/Apple Maps 버튼을 사용하세요.</div>${mapPlacesHTML(d)}</div><div class="map-shell"><div class="map" id="map-${d.id}"></div><div class="map-fallback" id="map-fallback-${d.id}"><div class="map-fallback-inner"><b>지도를 불러오지 못했어요.</b><p>인터넷 연결 또는 지도 타일 서버 상태를 확인하세요. 위 장소 목록의 Google Maps / Apple Maps 버튼은 그대로 사용할 수 있습니다.</p></div></div></div></div></div>${d.choices?`<div class="panel"><div class="panel-body"><h3 class="section-title">현장 선택</h3>${choicesHTML(d)}</div></div>`:''}<div class="split">${placesHTML(d.food,'식당 · 카페')}${placesHTML(d.parking,'주차 · 보급')}</div><div class="panel"><div class="panel-body"><h3 class="section-title">메모</h3><div class="alert ${d.id==='0828'?'danger':''}">${esc(d.note||'')}</div></div></div></section>`).join('');content.querySelectorAll('input[type=radio]').forEach(r=>r.onchange=e=>{store.set('choice_'+e.target.name,e.target.value);document.querySelectorAll(`input[name="${e.target.name}"]`).forEach(x=>x.closest('.choice').classList.toggle('selected',x.checked))});content.querySelectorAll('.done-check').forEach(c=>{c.checked=store.get('done_'+c.dataset.id)==='1';c.onchange=()=>store.set('done_'+c.dataset.id,c.checked?'1':'0')})}
const maps={};
function showMapFallback(id){const el=document.getElementById('map-fallback-'+id);if(el)el.classList.add('show')}
function initMap(d){if(maps[d.id]){setTimeout(()=>maps[d.id].invalidateSize(),100);return}if(!d.points?.length){showMapFallback(d.id);return}if(!window.L){showMapFallback(d.id);return}try{const m=L.map('map-'+d.id,{scrollWheelZoom:false,tap:true});let tileLoaded=false,tileErrors=0;const tiles=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(m);tiles.on('tileload',()=>{tileLoaded=true;const f=document.getElementById('map-fallback-'+d.id);if(f)f.classList.remove('show')});tiles.on('tileerror',()=>{tileErrors++;if(tileErrors>=3&&!tileLoaded)showMapFallback(d.id)});const bounds=[];d.points.forEach((p,i)=>{L.marker([p[1],p[2]]).addTo(m).bindPopup(`<b>${esc(p[0])}</b><br><div style="margin-top:7px"><a target="_blank" rel="noopener" href="${gmUrl(p[0],p[1],p[2])}">Google Maps</a> · <a target="_blank" rel="noopener" href="${amUrl(p[0],p[1],p[2])}">Apple Maps</a></div>`);bounds.push([p[1],p[2]])});m.fitBounds(bounds,{padding:[24,24],maxZoom:12});maps[d.id]=m;setTimeout(()=>{if(!tileLoaded)showMapFallback(d.id)},7000)}catch(e){showMapFallback(d.id)}}
function hashTripId(){const h=(location.hash||'').replace('#','');return trip.some(d=>d.id===h)?h:null}
let activeId=hashTripId()||todayTripId();
function updateSwitcher(id){const idx=trip.findIndex(d=>d.id===id),d=trip[idx];prevDay.disabled=idx<=0;nextDay.disabled=idx>=trip.length-1;switcherLabel.textContent=`${d.date} · ${d.title}`;switcherSub.textContent=isDeviceToday(id)?'오늘 일정':'이전 / 다음 날짜';const navBtn=document.querySelector(`.day-btn[data-id="${id}"]`);if(navBtn)navBtn.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})}
function activateDay(id,scroll=true){activeId=id;document.querySelectorAll('.day-card').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.day-btn').forEach(x=>{x.classList.remove('active');x.setAttribute('aria-current','false')});const card=document.getElementById('day-'+id);if(card)card.classList.add('active');const btn=document.querySelector(`.day-btn[data-id="${id}"]`);if(btn){btn.classList.add('active');btn.setAttribute('aria-current','page')}if(location.hash!==`#${id}`)history.replaceState(null,'',`#${id}`);const d=trip.find(x=>x.id===id);if(d)initMap(d);updateSwitcher(id);if(scroll)window.scrollTo({top:document.querySelector('.layout').offsetTop-6,behavior:'smooth'})}
function moveDay(delta){const idx=trip.findIndex(d=>d.id===activeId),next=trip[idx+delta];if(next)activateDay(next.id)}
function resetChoices(){if(!confirm('저장된 선택과 완료 체크를 모두 초기화할까요?'))return;store.keys().filter(k=>k.startsWith('choice_')||k.startsWith('done_')).forEach(k=>store.remove(k));location.reload()}
renderNav(activeId);renderContent();activateDay(activeId,false);prevDay.onclick=()=>moveDay(-1);nextDay.onclick=()=>moveDay(1);todayBtn.onclick=()=>activateDay(todayTripId());
window.addEventListener('resize',()=>{if(maps[activeId])setTimeout(()=>maps[activeId].invalidateSize(),100)});
window.addEventListener('hashchange',()=>{const h=hashTripId();if(h&&h!==activeId)activateDay(h)});
</script>
</body></html>
