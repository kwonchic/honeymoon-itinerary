function mapEntryRows(d){
  const rows=[];

  (d.mapExtra||[]).forEach(x=>{const q=searchName(x[1],placeContext[d.id]);if(q)rows.push({label:`${x[0]} ${x[1]}${x[5]?` · ${x[5]}`:''}`,name:q,lat:x[2],lon:x[3],emoji:x[0],kind:x[4]||'extra',extraNote:x[5]})});
  selectedOptionEntries(d).forEach(opt=>(opt.points||[]).forEach(p=>{const q=searchName(p[0],placeContext[d.id]);if(q)rows.push({label:`옵션 · ${p[0]}`,name:q,lat:p[1],lon:p[2],emoji:'✨',kind:'option',optionNote:opt.note})}));
  const selectedSteak=selectedSteakId(d);
  steakList(d).forEach(x=>{const q=searchName(x.name,placeContext[d.id]);if(q)rows.push({label:`🥩 ${x.name}${selectedSteak===x.id?' · 선택됨':''}`,name:q,lat:x.lat,lon:x.lon,emoji:'🥩',kind:'steak',selected:selectedSteak===x.id})});
  (d.food||[]).forEach(x=>splitPlaceNames(x[1]).forEach(n=>{const q=searchName(n,placeContext[d.id]);if(q)rows.push({label:`${emojiFor('food '+x[0],n)} ${n}`,name:q,emoji:emojiFor('food '+x[0],n),kind:'food'})}));
  (d.parking||[]).forEach(x=>splitPlaceNames(x[1]).forEach(n=>{if(mapListExcludeNames.has(n))return;const q=searchName(n,placeContext[d.id]);if(q)rows.push({label:`${emojiFor('parking',n)} ${n}`,name:q,emoji:emojiFor('parking',n),kind:'parking'})}));
  return rows;
}
function dateForId(id){return new Date(2026,Number(id.slice(0,2))-1,Number(id.slice(2,4)))}
function dayKey(dt){return `${String(dt.getMonth()+1).padStart(2,'0')}${String(dt.getDate()).padStart(2,'0')}`}
function todayTripId(){const now=new Date();const key=dayKey(now);if(now.getFullYear()===2026&&trip.some(d=>d.id===key))return key;const first=dateForId(trip[0].id),last=dateForId(trip[trip.length-1].id);if(now<first)return trip[0].id;if(now>last)return trip[trip.length-1].id;let best=trip[0],bestDiff=Infinity;trip.forEach(d=>{const diff=Math.abs(dateForId(d.id)-now);if(diff<bestDiff){best=d;bestDiff=diff}});return best.id}
function isDeviceToday(id){const n=new Date();return n.getFullYear()===2026&&dayKey(n)===id}

}
function renderNav(activeId){dayNav.innerHTML=trip.map(d=>`<button type="button" class="day-btn ${d.id===activeId?'active':''}" data-id="${d.id}" aria-current="${d.id===activeId?'page':'false'}"><div class="date">${esc(d.date)}${isDeviceToday(d.id)?'<span class="today-badge">TODAY</span>':''}</div><div class="name">${esc(d.title)}</div></button>`).join('');dayNav.querySelectorAll('.day-btn').forEach(b=>b.onclick=()=>activateDay(b.dataset.id))}
function tagHTML(tags=[]){return `<div class="pill-row">${tags.map(t=>`<span class="pill ${t[2]||''}">${esc(t[0])} ${esc(t[1])}</span>`).join('')}</div>`}
function constraintsHTML(id){const rows=constraints[id]||[];return rows.length?`<div class="constraint-wrap">${rows.map((x,i)=>`<div class="constraint-card ${id==='0828'||(id==='0821'&&i===0)?'critical':''}"><div class="constraint-icon">${x[0]}</div><div><b>${esc(x[1])}</b><span>${esc(x[2])}</span></div></div>`).join('')}</div>`:''}
function timelineHTML(items=[]){return `<div class="timeline">${items.map(x=>`<div class="stop"><div class="stop-icon">${x[0]}</div><div class="stop-content"><b>${esc(x[1])}</b><small>${esc(x[2])}</small></div></div>`).join('')}</div>`}
function optionDetailsHTML(d){
  if(!d.choices)return '';
  const cards=[];
  Object.keys(d.choices).forEach(key=>{
    const val=store.get('choice_'+key)||store.get(key);
    const info=optionDetails[key]?.[val];
    if(info)cards.push(info);
  });
  if(!cards.length)return '';
  return `<div class="option-summary-wrap">${cards.map(info=>`<div class="option-summary"><b>${esc(info.title)}</b><p>${esc(info.text)}</p>${info.places?`<div class="place-line">📍 ${esc(info.places)}</div>`:''}</div>`).join('')}</div>`;
}
function choicesHTML(d){if(!d.choices)return'';return Object.entries(d.choices).map(([key,g])=>{const saved=store.get('choice_'+key)||store.get(key);return `<div style="margin-bottom:16px"><h3 class="section-title">${esc(g.label)}</h3><div class="choice-group">${g.options.map(o=>`<label class="choice ${saved===o[0]?'selected':''}"><input type="radio" name="${key}" value="${o[0]}" ${saved===o[0]?'checked':''}><span><b>${esc(o[1])}</b><small>${esc(o[2])}</small></span></label>`).join('')}</div></div>`}).join('')}
function selectedSteakId(d){return store.get('steak_'+d.id)||store.get('choice_steak_'+d.id)||'none'}
function steakList(d){const s=steakOptions[d.id];return Array.isArray(s)?s:[]}
function steakHTML(d){
  const raw=steakOptions[d.id]; if(!raw)return '';
  if(!Array.isArray(raw))return `<div class="panel"><div class="panel-body"><h3 class="section-title">🥩 Steak Options</h3><div class="steak-note"><b>${esc(raw.note)}</b><br>${esc(raw.text)}</div></div></div>`;
  const key='steak_'+d.id, saved=selectedSteakId(d);
  const choices=[{id:'none',name:'오늘은 스테이크 선택 안 함',why:'기존 식당·카페 후보를 그대로 사용합니다.'},...raw];
  return `<div class="panel"><div class="panel-body"><h3 class="section-title">🥩 Steak Options</h3>${raw.length===1?'<div class="steak-note"><b>검증 기준 통과 후보 1곳</b><br>2개를 채우기 위해 낮은 품질 후보를 추가하지 않았습니다.</div><div style="height:10px"></div>':''}<div class="cards">${raw.map(x=>`<div class="place steak-card"><div class="kicker">${esc(x.highlight||'Steak option')}</div><h4>${esc(x.name)}</h4><div class="steak-meta"><span><b>Area</b> · ${esc(x.area)}</span>${x.address?`<span><b>Address</b> · ${esc(x.address)}</span>`:''}<span><b>Style</b> · ${esc(x.style)}</span><span><b>Priority</b> · ${esc(x.priority)}</span>${x.badge?`<span class="badge">${esc(x.badge)}</span>`:''}${x.conditional?`<span class="badge">${esc(x.conditional)}</span>`:''}</div><p>${esc(x.why)}</p>${x.caution?`<p><b>Caution</b> · ${esc(x.caution)}</p>`:''}${x.logic?`<p><b>선택 기준</b> · ${esc(x.logic)}</p>`:''}${mapButtons(x.name,x.lat,x.lon,placeContext[d.id])}</div>`).join('')}</div><div class="choice-group steak-choice">${choices.map(x=>`<label class="choice ${saved===x.id?'selected':''}"><input type="radio" name="${key}" value="${x.id}" ${saved===x.id?'checked':''}><span><b>${esc(x.name)}</b><small>${esc(x.why||'')}</small></span></label>`).join('')}</div></div></div>`;
}
function selectedSteakEntries(d){const id=selectedSteakId(d);return steakList(d).filter(x=>x.id===id)}
function placesHTML(items,title,ctx=''){if(!items?.length)return'';return `<div class="panel"><div class="panel-body"><h3 class="section-title">${esc(title)}</h3><div class="cards">${items.map(x=>`<div class="place"><div class="kicker">${esc(x[0])}</div><h4>${esc(x[1])}</h4><p>${esc(x[2])}</p>${mapButtons(x[1],undefined,undefined,ctx)}</div>`).join('')}</div></div></div>`}
function mapPlacesHTML(d){const rows=mapEntryRows(d);if(!rows.length)return'';const notes=[...new Set(rows.filter(r=>r.kind==='option'&&r.optionNote).map(r=>r.optionNote))];return `${notes.map(n=>`<div class="option-note">✨ ${esc(n)}</div>`).join('')}<div class="map-place-list">${rows.map(r=>`<div class="map-place-row ${r.kind==='steak'?'steak-row':r.kind==='optional'?'optional-row':r.kind==='lunch'?'lunch-row':''}"><span>${esc(r.label)}</span><div class="map-actions"><a class="map-link google" target="_blank" rel="noopener" href="${gmUrl(r.name,r.lat,r.lon)}">Google</a><a class="map-link apple" target="_blank" rel="noopener" href="${amUrl(r.name,r.lat,r.lon)}">Apple</a></div></div>`).join('')}</div>`}
function renderContent(){content.innerHTML=trip.map(d=>`<section class="day-card" id="day-${d.id}"><div class="top-grid"><div class="panel"><div class="panel-body"><div class="day-title"><div><div class="eyebrow" style="color:#6a665f">${esc(d.date)}${isDeviceToday(d.id)?'<span class="today-badge">오늘</span>':''}</div><h2>${esc(d.title)}</h2><p>${esc(d.subtitle)}</p></div></div>${tagHTML(d.tags)}${constraintsHTML(d.id)}<div style="height:16px"></div><h3 class="section-title">오늘의 흐름</h3>${timelineHTML(d.timeline)}<label class="done-toggle"><input type="checkbox" class="done-check" data-id="${d.id}"> 오늘 일정 완료</label></div></div><div class="panel"><div class="panel-body" style="padding-bottom:12px"><h3 class="section-title">지도</h3><div class="footer-note">숫자 핀은 기본 동선, ✨는 선택한 옵션, 음식·카페 이모지는 후보입니다. 지도 타일이 안 뜨면 Google Maps 버튼을 사용하세요.</div>${mapPlacesHTML(d)}</div><div class="map-shell"><div class="map" id="map-${d.id}"></div><div class="map-fallback" id="map-fallback-${d.id}"><div class="map-fallback-inner"><b>지도를 불러오지 못했어요.</b><p>인터넷 연결 또는 지도 타일 서버 상태를 확인하세요. 위 장소 목록의 Google Maps / Apple Maps 버튼은 그대로 사용할 수 있습니다.</p></div></div></div></div></div>${d.choices?`<div class="panel"><div class="panel-body"><h3 class="section-title">현장 선택</h3>${choicesHTML(d)}<div class="option-details-slot">${optionDetailsHTML(d)}</div></div></div>`:''}${steakHTML(d)}<div class="split">${placesHTML(d.food,'식당 · 카페',placeContext[d.id])}${placesHTML(d.parking,'주차 · 보급',placeContext[d.id])}</div><div class="panel"><div class="panel-body"><h3 class="section-title">메모</h3><div class="alert ${d.id==='0828'?'danger':''}">${esc(d.note||'')}</div></div></div></section>`).join('');content.querySelectorAll('input[type=radio]').forEach(r=>r.onchange=e=>{store.set('choice_'+e.target.name,e.target.value);if(e.target.name.startsWith('steak_')||e.target.name==='cinqueTorri_0821')store.set(e.target.name,e.target.value);document.querySelectorAll(`input[name="${e.target.name}"]`).forEach(x=>x.closest('.choice').classList.toggle('selected',x.checked));refreshActiveMap()});content.querySelectorAll('.done-check').forEach(c=>{c.checked=store.get('done_'+c.dataset.id)==='1';c.onchange=()=>store.set('done_'+c.dataset.id,c.checked?'1':'0')})}
const maps={};
function showMapFallback(id){const el=document.getElementById('map-fallback-'+id);if(el)el.classList.add('show')}
function initMap(d){if(maps[d.id]){setTimeout(()=>maps[d.id].invalidateSize(),100);return}if(!d.points?.length){showMapFallback(d.id);return}if(!window.L){showMapFallback(d.id);return}try{const m=L.map('map-'+d.id,{scrollWheelZoom:false,tap:true});let tileLoaded=false,tileErrors=0;const tiles=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(m);tiles.on('tileload',()=>{tileLoaded=true;const f=document.getElementById('map-fallback-'+d.id);if(f)f.classList.remove('show')});tiles.on('tileerror',()=>{tileErrors++;if(tileErrors>=3&&!tileLoaded)showMapFallback(d.id)});const bounds=[];d.points.forEach((p,i)=>{const q=searchName(p[0],placeContext[d.id]);const icon=L.divIcon({className:'emoji-marker',html:`<span>${emojiFor('point',p[0])}</span><b>${i+1}</b>`,iconSize:[34,34],iconAnchor:[17,17]});L.marker([p[1],p[2]],{icon}).addTo(m).bindPopup(`<b>${esc(p[0])}</b><br><div style="margin-top:7px"><a target="_blank" rel="noopener" href="${gmUrl(q,p[1],p[2])}">Google Maps</a> · <a target="_blank" rel="noopener" href="${amUrl(q,p[1],p[2])}">Apple Maps</a></div>`);bounds.push([p[1],p[2]])});(d.mapExtra||[]).forEach(x=>{const q=searchName(x[1],placeContext[d.id]);const icon=L.divIcon({className:`emoji-marker ${x[4]||'extra'}`,html:`<span>${x[0]}</span><b>${x[4]==='optional'?'옵':'식'}</b>`,iconSize:[34,34],iconAnchor:[17,17]});L.marker([x[2],x[3]],{icon}).addTo(m).bindPopup(`<b>${esc(x[1])}</b><br>${esc(x[5]||'')}<br><div style="margin-top:7px"><a target="_blank" rel="noopener" href="${gmUrl(q,x[2],x[3])}">Google Maps</a> · <a target="_blank" rel="noopener" href="${amUrl(q,x[2],x[3])}">Apple Maps</a></div>`);bounds.push([x[2],x[3]])});selectedOptionEntries(d).forEach(opt=>(opt.points||[]).forEach(p=>{const q=searchName(p[0],placeContext[d.id]);const icon=L.divIcon({className:'emoji-marker option',html:`<span>✨</span><b>옵</b>`,iconSize:[34,34],iconAnchor:[17,17]});L.marker([p[1],p[2]],{icon}).addTo(m).bindPopup(`<b>옵션 · ${esc(p[0])}</b><br>${esc(opt.note||'선택한 옵션')}<br><div style="margin-top:7px"><a target="_blank" rel="noopener" href="${gmUrl(q,p[1],p[2])}">Google Maps</a> · <a target="_blank" rel="noopener" href="${amUrl(q,p[1],p[2])}">Apple Maps</a></div>`);bounds.push([p[1],p[2]])}));steakList(d).filter(x=>x.lat&&x.lon).forEach(x=>{const q=searchName(x.name,placeContext[d.id]);const sel=selectedSteakId(d)===x.id;const icon=L.divIcon({className:`emoji-marker steak ${sel?'selected':''}`,html:`<span>🥩</span><b>${sel?'✓':'S'}</b>`,iconSize:[34,34],iconAnchor:[17,17]});L.marker([x.lat,x.lon],{icon}).addTo(m).bindPopup(`<b>🥩 ${esc(x.name)}</b><br>${esc(x.badge||'Steak option')}<br>${esc(x.why||'')}<br><div style="margin-top:7px"><a target="_blank" rel="noopener" href="${gmUrl(q,x.lat,x.lon)}">Google Maps</a> · <a target="_blank" rel="noopener" href="${amUrl(q,x.lat,x.lon)}">Apple Maps</a></div>`);bounds.push([x.lat,x.lon])});m.fitBounds(bounds,{padding:[24,24],maxZoom:12});maps[d.id]=m;setTimeout(()=>{if(!tileLoaded)showMapFallback(d.id)},7000)}catch(e){showMapFallback(d.id)}}
function hashTripId(){const h=(location.hash||'').replace('#','');return trip.some(d=>d.id===h)?h:null}
let activeId=hashTripId()||todayTripId();
function updateSwitcher(id){const idx=trip.findIndex(d=>d.id===id),d=trip[idx];prevDay.disabled=idx<=0;nextDay.disabled=idx>=trip.length-1;switcherLabel.textContent=`${d.date} · ${d.title}`;switcherSub.textContent=isDeviceToday(id)?'오늘 일정':'이전 / 다음 날짜';const navBtn=document.querySelector(`.day-btn[data-id="${id}"]`);if(navBtn)navBtn.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})}
function refreshActiveMap(){
  const d=trip.find(x=>x.id===activeId); if(!d)return;
  const panel=document.querySelector(`#day-${d.id} .map-place-list`)?.parentElement;
  if(panel){
    const list=document.querySelector(`#day-${d.id} .map-place-list`);
    const notes=document.querySelectorAll(`#day-${d.id} .option-note`);
    notes.forEach(n=>n.remove());
    if(list)list.outerHTML=mapPlacesHTML(d);
  }
  const slot=document.querySelector(`#day-${d.id} .option-details-slot`); if(slot)slot.innerHTML=optionDetailsHTML(d);
  if(maps[d.id]){maps[d.id].remove();delete maps[d.id];}
  const el=document.getElementById('map-'+d.id); if(el)el.innerHTML='';
  const fb=document.getElementById('map-fallback-'+d.id); if(fb)fb.classList.remove('show');
  initMap(d);
}
function activateDay(id,scroll=true){activeId=id;document.querySelectorAll('.day-card').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.day-btn').forEach(x=>{x.classList.remove('active');x.setAttribute('aria-current','false')});const card=document.getElementById('day-'+id);if(card)card.classList.add('active');const btn=document.querySelector(`.day-btn[data-id="${id}"]`);if(btn){btn.classList.add('active');btn.setAttribute('aria-current','page')}if(location.hash!==`#${id}`)history.replaceState(null,'',`#${id}`);const d=trip.find(x=>x.id===id);if(d)initMap(d);updateSwitcher(id);if(scroll)window.scrollTo({top:document.querySelector('.layout').offsetTop-6,behavior:'smooth'})}
function moveDay(delta){const idx=trip.findIndex(d=>d.id===activeId),next=trip[idx+delta];if(next)activateDay(next.id)}
function resetChoices(){if(!confirm('저장된 선택과 완료 체크를 모두 초기화할까요?'))return;store.keys().filter(k=>k.startsWith('choice_')||k.startsWith('done_')||k.startsWith('steak_')).forEach(k=>store.remove(k));location.reload()}
renderNav(activeId);setupToTop();renderContent();activateDay(activeId,false);prevDay.onclick=()=>moveDay(-1);nextDay.onclick=()=>moveDay(1);todayBtn.onclick=()=>activateDay(todayTripId());pdfBtn.onclick=()=>window.print();
window.addEventListener('resize',()=>{if(maps[activeId])setTimeout(()=>maps[activeId].invalidateSize(),100)});
window.addEventListener('hashchange',()=>{const h=hashTripId();if(h&&h!==activeId)activateDay(h)});
</script>
</body></html>
